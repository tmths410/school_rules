<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 생활지도 관리 시스템</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .nav-btn { text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    .nav-btn-sheet { background-color: #0F9D58; color: white; }
    .nav-btn-sheet:hover { background-color: #0b8043; }
    .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e9ecef; cursor: pointer; border-radius: 6px; font-weight: bold; }
    .tab-btn.active { background: #0d6efd; color: white; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button.submit-btn { background: #0d6efd; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #f1f3f5; }
    #dataLoader { text-align: center; font-weight: bold; padding: 20px; }
    .user-info { font-size: 13px; color: #555; text-align: right; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>📋 학생 생활지도 관리</h2>
    <div>
      <a id="sheetLink" href="#" target="_blank" class="nav-btn nav-btn-sheet">⚙️ 관리자</a>
    </div>
  </div>

  <!-- 구글 로그인 영역 -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <div id="g_id_onload"
      data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
      data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
    <div class="user-info" id="userStatus">🔓 로그인 필요</div>
  </div>

  <div id="dataLoader">⏳ 데이터를 불러오는 중입니다...</div>

  <div id="mainContent" style="display:none;">
    <!-- 탭 메뉴 -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('record')">✏️ 지도 사항 기록</button>
      <button class="tab-btn" onclick="switchTab('view')">📊 담임용 결과 확인</button>
    </div>

    <!-- 1. 지도 사항 기록 탭 -->
    <div id="recordTab">
      <div class="form-group">
        <label>학년 / 반 / 번호 / 이름</label>
        <select id="studentSelect">
          <option value="">-- 학생 선택 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>지도 항목</label>
        <select id="violationSelect"></select>
      </div>
      <div class="form-group">
        <label>지도 교사 성명</label>
        <input type="text" id="teacherName" placeholder="교사 성명 입력">
      </div>
      <button class="submit-btn" onclick="submitData()">기록 저장하기</button>
    </div>

    <!-- 2. 담임용 결과 확인 탭 -->
    <div id="viewTab" style="display:none;">
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <select id="viewGrade">
          <option value="1">1학년</option>
          <option value="2">2학년</option>
          <option value="3">3학년</option>
        </select>
        <select id="viewClass">
          <!-- 1~10반 동적 생성 -->
        </select>
        <button onclick="loadClassData()" style="width: auto; background: #198754; color: white;">조회</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>번호</th>
            <th>이름</th>
            <th>일시</th>
            <th>지도 내용</th>
            <th>지도 교사</th>
          </tr>
        </thead>
        <tbody id="resultTableBody">
          <tr><td colspan="5">학반을 선택한 후 조회 버튼을 눌러주세요.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ⚠️ 본인의 Google Cloud Console에서 발급받은 OAuth Client ID로 변경하세요.
  const GOOGLE_CLIENT_ID = "1079310998076-p4cmjrusteufl8coqtju9vfi2gpi6o4h.apps.googleusercontent.com";
  let currentUserToken = "";

  window.onload = function () {
    // 구글 클라이언트 ID 자동 설정
    const gIdDiv = document.getElementById("g_id_onload");
    if(gIdDiv) gIdDiv.setAttribute("data-client_id", GOOGLE_CLIENT_ID);

    // 초기 데이터 로드 요청
    fetchAppScript({ action: "getInitialData" }, function(response) {
      document.getElementById('dataLoader').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';

      // 접속 즉시 관리자 시트 URL 연결
      if (response.spreadsheetUrl) {
        document.getElementById("sheetLink").href = response.spreadsheetUrl;
      }

      initStudentSelect(response.students);
      initViolationSelect(response.violations);
      initClassOptions();
    });
  };

  // 구글 로그인 콜백
  function handleCredentialResponse(response) {
    currentUserToken = response.credential;
    fetchAppScript({ action: "verifyLogin", idToken: currentUserToken }, function(res) {
      if(res.success) {
        document.getElementById("userStatus").innerText = "🔒 로그인됨: " + res.email;
        alert("구글 인증 성공!");
      } else {
        alert(res.message);
      }
    });
  }

  // 탭 전환
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (tab === 'record') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('recordTab').style.display = 'block';
      document.getElementById('viewTab').style.display = 'none';
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('recordTab').style.display = 'none';
      document.getElementById('viewTab').style.display = 'block';
    }
  }

  // 담임용 학반 데이터 조회
  function loadClassData() {
    if (!currentUserToken) {
      alert("구글 로그인이 필요합니다. 상단 구글 버튼으로 로그인해 주세요.");
      return;
    }

    const grade = document.getElementById("viewGrade").value;
    const classNum = document.getElementById("viewClass").value;

    fetchAppScript({
      action: "getClassViolationData",
      grade: grade,
      classNum: classNum,
      idToken: currentUserToken
    }, function(res) {
      if (res.success) {
        renderTable(res.list);
      } else {
        alert(res.message);
      }
    });
  }

  function renderTable(list) {
    const tbody = document.getElementById("resultTableBody");
    tbody.innerHTML = "";
    if (!list || list.length === 0) {
      tbody.innerHTML = "<tr><td colspan='5'>기록된 지도 사항이 없습니다.</td></tr>";
      return;
    }
    list.forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${item.num}</td><td>${item.name}</td><td>${item.date}</td><td>${item.violation}</td><td>${item.teacher}</td>`;
      tbody.appendChild(tr);
    });
  }

  // 백엔드 통신 공통 함수
  function fetchAppScript(data, callback) {
    // 앱스크립트 웹앱 URL 입력 (exec 주소)
    const googleAppScriptUrl = "https://script.google.com/macros/s/AKfycbz9Lbbtqj6a80vusBiQMrmz3jk5qzVTxvNp9ehS-DktAdBlzmg9V_GSGMc6Gu9G2JNG/exec"; 
    
    fetch(googleAppScriptUrl, {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => callback(response))
    .catch(err => console.error("Error:", err));
  }

  function initStudentSelect(students) {
    const select = document.getElementById("studentSelect");
    students.forEach(s => {
      const opt = document.createElement("option");
      opt.value = JSON.stringify(s);
      opt.innerText = `${s.grade}학년 ${s.classNum}반 ${s.num}번 ${s.name}`;
      select.appendChild(opt);
    });
  }

  function initViolationSelect(violations) {
    const select = document.getElementById("violationSelect");
    violations.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.innerText = v;
      select.appendChild(opt);
    });
  }

  function initClassOptions() {
    const select = document.getElementById("viewClass");
    for (let i = 1; i <= 10; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.innerText = i + "반";
      select.appendChild(opt);
    }
  }
</script>

</body>
</html>
